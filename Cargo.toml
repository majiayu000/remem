[package]
name = "remem-ai"
version = "0.6.62"
edition = "2021"
description = "Local-first coding agent memory for Claude Code and OpenAI Codex"
license = "MIT"
repository = "https://github.com/majiayu000/remem"
homepage = "https://majiayu000.github.io/remem/"
readme = "README.md"
keywords = ["claude-code", "codex", "memory", "mcp", "agent-memory"]
categories = ["command-line-utilities", "development-tools"]
exclude = [
  ".remem/",
  "eval/locomo/locomo10.json",
  "eval/locomo/results/",
  "eval/local/results/",
  "plan/",
  "docs/",
  "SPEC-*.md",
]

[lib]
name = "remem"

[[bin]]
name = "remem"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "string"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "backup"] }
sqlite-vec = "0.1.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
regex-lite = "0.1"
brush-parser = "0.4.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
anyhow = "1"
fs2 = "0.4"
tokio = { version = "1", features = ["full"] }
rmcp = { version = "0.15", features = ["server", "transport-io", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
axum = { version = "0.8.8", features = ["json"] }
getrandom = "0.3"
toml_edit = "0.22"
libc = "0.2"
sha2 = "0.10"
ring = "0.17"
fastembed = { version = "5.17.2", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"], optional = true }
hf-hub = { version = "0.5.0", default-features = false, features = ["ureq", "rustls-tls"], optional = true }
ndarray = { version = "0.17.2", default-features = false, optional = true }
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["ndarray", "std", "api-24"], optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
default = ["local-onnx"]
local-onnx = [
    "dep:fastembed",
    "dep:hf-hub",
    "dep:ndarray",
    "dep:ort",
    "dep:tokenizers",
]

[profile.release]
opt-level = "z"
lto = true
strip = true
